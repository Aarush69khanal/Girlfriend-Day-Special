<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
overflow-x:hidden;
color:white;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-family:'Great Vibes',cursive;
font-size:70px;
margin-bottom:20px;
animation:fade 2s;
}

.hero p{
font-size:22px;
max-width:700px;
margin:auto;
line-height:1.8;
}

.btn{
display:inline-block;
margin-top:35px;
padding:15px 35px;
background:white;
color:#ff4f81;
text-decoration:none;
border-radius:40px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:scale(1.1);
}

section{
padding:80px 10%;
}

.title{
text-align:center;
font-size:45px;
margin-bottom:40px;
font-family:'Great Vibes',cursive;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.photo{
height:350px;
border:4px dashed white;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
background:rgba(255,255,255,.15);
overflow:hidden;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.letter{
background:rgba(255,255,255,.15);
padding:40px;
border-radius:20px;
line-height:2;
font-size:20px;
backdrop-filter:blur(10px);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
margin-top:40px;
}

.card{
background:rgba(255,255,255,.18);
padding:30px;
border-radius:20px;
text-align:center;
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
background:rgba(255,255,255,.3);
}

.card h2{
margin-bottom:15px;
}

.music{
text-align:center;
margin-top:50px;
}

footer{
text-align:center;
padding:40px;
font-size:18px;
}

.heart{
position:fixed;
bottom:-30px;
color:#fff;
animation:float 8s linear infinite;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(0) rotate(0deg);
}
100%{
transform:translateY(-110vh) rotate(360deg);
}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="hero">
<div>
<h1>Happy Girlfriend Day ❤️</h1>

<p>
To the most beautiful girl in my life,
thank you for filling my world with happiness,
love, and countless unforgettable memories.
You are my heart, my happiness, and my forever.
</p>

<a href="surprise.html" class="btn">Click To See Our Beautiful Memories ❤️</a>
</div>
</div>

<script>
function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*30)+"px";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},9000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
